[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gvcml"
version = "0.1.0"
description = "Guardian-ML-led cybersecurity governance for the complete application lifecycle"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
ml = ["scikit-learn>=1.4,<2", "joblib>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]
[project.scripts]
gvcml = "gvcml.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"
